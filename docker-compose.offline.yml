# =============================================================================
# OFFLINE / SOVEREIGN stack — the full HA + observability control plane, packaged
# to deploy and run with ZERO outbound network (Step 4).
#
# This is a deliberately SELF-CONTAINED, FLATTENED artifact: it folds together
# docker-compose.yml + docker-compose.ops-ha.yml + docker-compose.ops-obs.yml with
# the changes required for an offline / air-gapped-deploy target. Keep it in sync
# with those three files when they change (there is no automatic drift check).
#
# Differences from the layered dev/HA/obs stack, and WHY:
#   * BOTH networks are `internal: true` — the sovereignty egress block. On Docker
#     Desktop this blocks container egress at the IP layer (verified) but also
#     removes host-loopback published-port reachability, so this file publishes NO
#     host ports and the split-brain harness is run from an in-container runner
#     (deploy/offline/harness-runner) that reaches services by name. See
#     deploy/MULTI_CLOUD.md §Offline Packaging.
#   * NO bind mounts and NO `build:` — every service uses a pre-loaded image with
#     `pull_policy: never`. A runner-driven `docker compose` resolves bind sources
#     against the runner CWD (not the host), so host-path mounts cannot be used;
#     the app code is baked into tess-engine-app:offline and the otel config is
#     baked into tess-engine-otel:offline (no ./deploy/... mount).
#   * `version:` is omitted (obsolete Compose attribute).
#
# Bring-up (from the repo root, images already loaded):
#   docker compose -f docker-compose.offline.yml -p tess-engine up -d --no-build
# Acceptance (harness) is driven by deploy/offline/verify-egress-blocked.sh.
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - ops-ha-redis

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    pull_policy: never
    restart: unless-stopped
    environment:
      ETCD_NAME: tess-etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: tess-etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: tess-ops-cp
      ETCD_INITIAL_CLUSTER_STATE: new
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  otel-collector:
    image: tess-engine-otel:offline
    pull_policy: never
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    # Verification-only scaffolding: run as root so the file exporter can write into
    # the named spans volume (the distroless image's default UID 10001 cannot). The
    # config is BAKED into the image (no host bind mount) — see deploy/offline/otel.
    user: "0:0"
    volumes:
      - ops_spans:/spans
    expose:
      - "4318"
    networks:
      - default

  web:
    image: tess-engine-app:offline
    pull_policy: never
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OPS_HA_ENABLED: "true"
      OPS_ETCD_ENDPOINTS: http://etcd:2379
      OPS_CP_INSTANCE_ID: cp-a
      OPS_ETCD_LEASE_TTL_SECONDS: "10"
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-ha-harness-token}
      OPS_METRICS_ENABLED: "true"
      OPS_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_BSP_SCHEDULE_DELAY: "500"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - default
      - ops-ha-redis

  web-standby:
    image: tess-engine-app:offline
    pull_policy: never
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OPS_HA_ENABLED: "true"
      OPS_ETCD_ENDPOINTS: http://etcd:2379
      OPS_CP_INSTANCE_ID: cp-b
      OPS_ETCD_LEASE_TTL_SECONDS: "10"
      OPS_PROBE_ENABLED: "true"
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-ha-harness-token}
      OPS_METRICS_ENABLED: "true"
      OPS_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_BSP_SCHEDULE_DELAY: "500"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - default
      - ops-ha-redis

  worker:
    image: tess-engine-app:offline
    pull_policy: never
    restart: unless-stopped
    # --concurrency=1 makes the prefork metrics exposition correct (single child binds
    # :9109 and increments the counters it serves). Required by s10. See ops-obs overlay.
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1
    expose:
      - "9109"
    environment:
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OPS_HA_ENABLED: "true"
      OPS_ETCD_ENDPOINTS: http://etcd:2379
      OPS_CP_INSTANCE_ID: cp-a
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-ha-harness-token}
      OPS_METRICS_ENABLED: "true"
      OPS_METRICS_WORKER_PORT: "9109"
      OPS_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_BSP_SCHEDULE_DELAY: "500"
    depends_on:
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - default

networks:
  # Both internal:true — the sovereignty egress block. `default` becomes
  # `tess-engine_default` (the name the harness discovers).
  default:
    internal: true
  ops-ha-redis:
    name: ops-ha-redis
    internal: true

volumes:
  etcd_data:
  ops_spans:
