# Opt-in control-plane HA overlay: etcd + primary/standby web.
#
# Usage (from repo root, with a base compose that already defines redis/web image):
#   docker compose -f docker-compose.yml -f docker-compose.ops-ha.yml up --build
#
# Or against prod file:
#   docker compose -f docker-compose.prod.yml -f docker-compose.ops-ha.yml up --build
#
# web (cp-a) and web-standby (cp-b) share Redis; only the etcd lease holder
# mutates ops state (Redis CAS on ops:control_plane:fence_term).
#
# ops-ha-redis: optional second network so the split-brain harness can partition
# primary↔Redis without also cutting etcd (see scripts/ops_cp_splitbrain).

networks:
  ops-ha-redis:
    name: ops-ha-redis

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    restart: unless-stopped
    environment:
      ETCD_NAME: tess-etcd
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: tess-etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: tess-ops-cp
      ETCD_INITIAL_CLUSTER_STATE: new
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test:
        [
          "CMD",
          "etcdctl",
          "endpoint",
          "health",
          "--endpoints=http://127.0.0.1:2379",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    networks:
      - default
      - ops-ha-redis

  web:
    environment:
      OPS_HA_ENABLED: "true"
      OPS_ETCD_ENDPOINTS: http://etcd:2379
      OPS_CP_INSTANCE_ID: cp-a
      OPS_ETCD_LEASE_TTL_SECONDS: "10"
      # Harness / local HA demo token (override in real deploys).
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-ha-harness-token}
    networks:
      - default
      - ops-ha-redis
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_started

  web-standby:
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    ports:
      - "8001:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      OPS_HA_ENABLED: "true"
      OPS_ETCD_ENDPOINTS: http://etcd:2379
      OPS_CP_INSTANCE_ID: cp-b
      OPS_ETCD_LEASE_TTL_SECONDS: "10"
      OPS_PROBE_ENABLED: "true"
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-ha-harness-token}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DEFAULT_LLM_PROVIDER: ollama
    networks:
      - default
      - ops-ha-redis
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    environment:
      OPS_HA_ENABLED: "true"
      OPS_ETCD_ENDPOINTS: http://etcd:2379
      # Must match the co-located primary web instance id when this worker
      # should be allowed to mutate; for dual-web demo, point at cp-a host worker.
      OPS_CP_INSTANCE_ID: cp-a
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-ha-harness-token}

volumes:
  etcd_data:
